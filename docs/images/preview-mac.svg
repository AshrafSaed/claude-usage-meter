<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <rect width="720" height="420" rx="14" fill="#DDE3EC"/>

  <!-- menu bar -->
  <rect x="0" y="0" width="720" height="30" fill="#F4F4F6"/>
  <text x="40" y="20" font-size="13" font-weight="700" fill="#111">Finder</text>
  <text x="100" y="20" font-size="13" fill="#111">File   Edit   View   Go   Window   Help</text>

  <rect x="376" y="4" width="132" height="22" rx="6" fill="#D8D8DE"/>
  <circle cx="392" cy="15" r="6.5" fill="none" stroke="#999" stroke-width="2.4"/>
  <path d="M392 8.5 A6.5 6.5 0 0 1 398.5 14.6" fill="none" stroke="#111" stroke-width="2.4"/>
  <text x="404" y="20" font-size="13" fill="#111">24% · 2h 14m</text>

  <text x="530" y="20" font-size="13" fill="#111">Wi-Fi    100%    Sat 22:45</text>

  <!-- popover -->
  <path d="M436 34 l10 -8 l10 8" fill="#FFFFFF"/>
  <rect x="290" y="34" width="306" height="350" rx="12" fill="#FFFFFF" stroke="#C9C9D2"/>
  <text x="306" y="64" font-size="16" font-weight="700" fill="#111">Claude usage</text>
  <text x="572" y="64" font-size="15" fill="#666">⟳</text>

  <!-- ring 5h -->
  <circle cx="368" cy="126" r="40" fill="none" stroke="#E6E6EA" stroke-width="9"/>
  <path d="M368 86 A40 40 0 0 1 407.9 123.5" fill="none" stroke="#007AFF" stroke-width="9" stroke-linecap="round"/>
  <text x="368" y="128" text-anchor="middle" font-size="18" font-weight="700" fill="#111">24%</text>
  <text x="368" y="144" text-anchor="middle" font-size="10" fill="#777">used</text>
  <text x="368" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#111">5-hour</text>
  <text x="368" y="208" text-anchor="middle" font-size="11" fill="#111">76% left</text>
  <text x="368" y="224" text-anchor="middle" font-size="11" fill="#111">resets in 2h 14m</text>
  <text x="368" y="240" text-anchor="middle" font-size="10" fill="#777">00:59</text>

  <!-- ring weekly -->
  <circle cx="518" cy="126" r="40" fill="none" stroke="#E6E6EA" stroke-width="9"/>
  <path d="M518 86 A40 40 0 1 1 478.1 128.5" fill="none" stroke="#E09A00" stroke-width="9" stroke-linecap="round"/>
  <text x="518" y="128" text-anchor="middle" font-size="18" font-weight="700" fill="#111">74%</text>
  <text x="518" y="144" text-anchor="middle" font-size="10" fill="#777">used</text>
  <text x="518" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Weekly</text>
  <text x="518" y="208" text-anchor="middle" font-size="11" fill="#111">26% left</text>
  <text x="518" y="224" text-anchor="middle" font-size="11" fill="#111">resets in 3d 1h</text>
  <text x="518" y="240" text-anchor="middle" font-size="10" fill="#777">Tue 09:00</text>

  <text x="306" y="276" font-size="11" fill="#777">Last session context: 8%</text>
  <text x="306" y="296" font-size="11" fill="#777">Updated just now</text>
  <line x1="306" y1="318" x2="580" y2="318" stroke="#E2E2E8"/>
  <text x="306" y="344" font-size="10" font-weight="700" fill="#B7006A">MIGATRONIX</text>
  <text x="580" y="344" text-anchor="end" font-size="12" fill="#111">Quit</text>

  <text x="16" y="408" font-size="11" fill="#555">Illustration of ClaudeUsageBar on macOS (values are examples)</text>
</svg>
